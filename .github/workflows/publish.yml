name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a burst of pushes doesn't queue a
# full release per commit — only the latest ref state is gated and published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    name: Gates (typecheck · build)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Conventional-Commits → semver bump of package.json, committed with [skip ci]
  # and pushed back to main. Pushes via a GitHub App token so the bot commit
  # isn't blocked by branch protection. Gated on gates going green.
  version-bump:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Version bump
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
      - name: Run version bump
        id: bump
        env:
          PKG_PATH: package.json
        run: bash .github/workflows/scripts/bump-version.sh

  # Publishes @ours.network/tg-connector to npm. Gates on `gates` passing
  # (bump-agnostic) so a manual version edit still ships and a down bump-bot
  # doesn't block releases. Reads from the post-bump checkout so the published
  # version always matches package.json.
  publish:
    needs: [gates, version-bump]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    name: Publish to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish @ours.network/tg-connector
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
