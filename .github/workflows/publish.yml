name: CI
# ---------------------------------------------------------------------------
# NOTE FOR ours-shared, AND FOR THE NEXT REPO THAT DROPS ITS MUFL.
#
# The "Compile MUFL packet" steps below are guarded with
#     if [ -x scripts/compile-mufl.sh ]; then scripts/compile-mufl.sh; fi
# which asks WHETHER THE SCRIPT EXISTS, not whether there is anything to
# compile. Those are different questions, and this repo just proved it: the
# mufl_code/ tree and all three @adapt-toolkit dependencies were deleted, the
# script was left behind and still executable, so the step fired, found no
# toolkit, and failed with "set ADAPT_TOOLKIT or npm-install @adapt-toolkit/mufl"
# — in a repo that has no MUFL at all. The step's own name says "repos with mufl
# sources only" and its guard does not test that.
#
# Fixed here by deleting the script with the tree it served. THE GUARD IS STILL
# WRONG UPSTREAM: `[ -d mufl_code ]` tests the actual condition. Worth fixing in
# ours-shared before the next repo hits it identically — this repo's copy is not
# diverged unilaterally, because a second divergent copy of shared boilerplate is
# its own problem.
# ---------------------------------------------------------------------------

# Canonical publish workflow for single-package ours.network repos.
# On apply, replace @ours.network/tg-connector with the repo's npm package.
#
# Prerequisites (one-time, GitHub repo settings → secrets):
#   - NPM_TOKEN: npm automation token with publish rights to the scope.
#   - VERSION_BUMP_APP_ID / VERSION_BUMP_APP_PRIVATE_KEY: the version-bump
#     GitHub App (must be installed on this repo) so the bump commit can push
#     past branch protection.

# Two mutually-exclusive release channels (mirrors ours-mcp):
#   main       → stable: Conventional-Commits semver bump, committed, published @latest.
#   prerelease → nightly: EPHEMERAL <patch-bump>-nightly.N version (never committed),
#                published to the npm `nightly` tag ONLY. By semver every X.Y.Z-nightly.N
#                sorts BELOW the clean X.Y.Z, and the fail-closed publish guard hardcodes
#                --tag nightly — so a nightly can NEVER move @latest.
on:
  push:
    branches: [main, prerelease]
  pull_request:
    branches: [main, prerelease]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a burst of pushes doesn't queue a
# full release per commit — only the latest ref state is gated and published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs check out with `submodules: recursive` — repos with MUFL sources
# pull their mufl_code/core submodule that way. The submodule repo is public
# today; if the org's repos ever go private, these checkouts will need an
# org-readable token for the submodule fetch.
jobs:
  gates:
    runs-on: ubuntu-latest
    name: Gates (typecheck · build · test)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile MUFL packet (repos with mufl sources only)
        run: if [ -x scripts/compile-mufl.sh ]; then scripts/compile-mufl.sh; fi
      - run: npm run typecheck --if-present
      - run: npm run build
      - run: npm test --if-present

  # Conventional-Commits → semver bump of package.json, committed with [skip ci]
  # and pushed back to main via a GitHub App token (so the bot commit isn't
  # blocked by branch protection). Gated on gates going green.
  version-bump:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Version bump
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
      - name: Run version bump
        id: bump
        env:
          PKG_PATH: package.json
        run: bash .github/workflows/scripts/bump-version.sh

  # Publishes from the post-bump SHA, so the published version always matches
  # package.json. Only runs when the bump produced a new version —
  # re-publishing an existing version would 403.
  npm-publish:
    needs: [gates, version-bump]
    if: needs.version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    name: Publish to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Compile MUFL packet (repos with mufl sources only)
        run: if [ -x scripts/compile-mufl.sh ]; then scripts/compile-mufl.sh; fi
      - run: npm run build
      # FAIL-CLOSED before the stable publish: asserts we are on main and the version is a
      # clean X.Y.Z (no pre-release suffix). A nightly build can never reach this job
      # (branch-gated), and if one somehow did, the guard refuses to publish to @latest.
      - name: Fail-closed stable guard (branch=main, clean version, @latest)
        run: bash .github/workflows/scripts/publish-guard.sh stable package.json latest
      - name: Publish @ours.network/tg-connector
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # NIGHTLY channel — prerelease branch ONLY. Every push to `prerelease` that
  # passes gates computes an EPHEMERAL <patch-bump>-nightly.N version in the
  # working tree (never committed), then publishes it to the npm `nightly` tag
  # via publish-nightly.sh (which hardcodes --tag nightly + runs the fail-closed
  # guard in-process). Branch-exclusive with the stable path above, so a nightly
  # can never touch @latest.
  nightly-publish:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/prerelease'
    runs-on: ubuntu-latest
    name: Publish nightly to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Compute ephemeral -nightly.N version (working tree only, not committed)
        run: bash .github/workflows/scripts/bump-nightly.sh
      - name: Compile MUFL packet (migration core)
        run: if [ -x scripts/compile-mufl.sh ]; then scripts/compile-mufl.sh; fi
      - run: npm run build
      # publish-nightly.sh runs the fail-closed guard then `npm publish --tag nightly`
      # atomically — there is no path from here to @latest.
      - name: Publish nightly (guard + --tag nightly, hardcoded)
        run: bash .github/workflows/scripts/publish-nightly.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
